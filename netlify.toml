# Netlify build configuration.
# Settings here take precedence over the site's UI build settings.

[build]
  # Root script builds the client workspace (outputs to client/dist).
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "24"

# --- Redirect order matters: Netlify uses the FIRST matching rule. ---
# The /api proxy must stay above the SPA fallback, or API calls would be
# swallowed by index.html.

# The frontend calls relative /api/* paths (in dev, Vite proxies these to the
# Express server on :4000). In production this rule forwards them to the API on
# Render, so no application code has to change.
#
# The host must match the Render service URL. `nmsl-league-api` is the service
# name in render.yaml; if Render assigned a different name (e.g. because that
# one was taken), update the host below to match.
[[redirects]]
  from = "/api/*"
  to = "https://nmsl-league-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: React Router owns routing, so any non-asset request must be
# served index.html (otherwise deep links like /standings or /portal 404).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
