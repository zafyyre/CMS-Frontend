# Netlify build configuration.
# Settings here take precedence over the site's UI build settings.

[build]
  # Root script builds the client workspace (outputs to client/dist).
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "24"

# The site is fully static: every API response was baked into client/public/data
# by scripts/bake-static.mjs, so there is no backend to proxy to. The previous
# /api/* proxy to Render has been removed along with the service.

# SPA fallback: React Router owns routing, so any non-asset request must be
# served index.html (otherwise deep links like /standings or /portal 404).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Static asset caching -------------------------------------------------
# Vite fingerprints these filenames (index-a1b2c3.js), so the content behind a
# given URL never changes — a new build produces a new name. They can be held
# forever, which makes repeat visits cost nothing.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML shell is the one file whose URL is stable across deploys. It must
# stay uncached, or visitors keep booting the previous build's asset names
# after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Baked API snapshots. Unlike /assets/* these filenames are stable across
# deploys, so they can't be immutable — a short TTL keeps repeat navigation
# instant while letting a re-bake reach visitors quickly. Netlify purges its
# own CDN on deploy; this only governs the browser cache.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
